<div class="dashboard">

  <div class="stats-grid">

    <mat-card
      *ngFor="let stat of stats"
      class="stat-card">

      <mat-icon>
        {{stat.icon}}
      </mat-icon>

      <h2>
        {{stat.value}}
      </h2>

      <p>
        {{stat.title}}
      </p>
    
    </mat-card>

  </div>

</div>
